<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mohamed Elwan">
  <title>Mohamed Elwan</title>
  <!-- ME as one ligature. The M is a single stroke that runs up the stem, down
       to the vertex and up to the right, where it stops: its right leg doubles
       as the top arm of the E. The E is a single stroke too, a Z of top arm,
       spine and bottom arm, parallel to that leg.

       Every diagonal is 3:2 (dx/dy 1.5) and every stroke is one width, so the
       three arms step evenly. Two filled outlines, no strokes, so it scales and
       masks cleanly at any size. Geometry is generated by tools/monogram.py.

       Full bleed, site palette: shell on paper. -->
  <rect width="512" height="512" fill="#0c0810"/>
  <g fill="#f6efea">
    <path d="M126.5,343.0 L126.5,155.5 L256.6,242.2 L438.5,120.9 L438.5,57.2 L256.6,178.4 L73.5,56.3 L73.5,378.3 Z"/>
