<!--
  Source for public/share-card.png, the 1200x630 og:image.

  Not part of the build - Vite never sees this file. Regenerate after changing
  the role or the employer list:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=6000 --screenshot=public/share-card.png \
      "file://$PWD/tools/share-card.html"

  The aircraft paths are copied from src/illustrations/Aircraft.jsx at its
  resting frame. Ground contact is y=350 in the 1200x460 viewBox, and the
  horizon here is placed so the wheels land on it - the same relationship
  --ground gives the live scenes.
-->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0c0810; color:#f6efea;
         font-family:'Instrument Sans',Arial,sans-serif; overflow:hidden; position:relative; }
  .glare { position:absolute; left:0; right:0; top:0; height:300px;
           background:radial-gradient(120% 120% at 50% 40%, transparent 38%, rgba(6,3,9,.6) 100%); z-index:6; }
  /* The horizon. The aircraft's wheels sit exactly on it - ground contact is
     y=350 in the 1200x460 viewBox, which is what --ground does on the site. */
  .ground { position:absolute; left:0; right:0; top:300px; height:2px;
            background:rgba(246,239,234,.34); z-index:3; }
  .plane { position:absolute; left:240px; top:29px; width:900px; z-index:4; }
  .plane svg { width:100%; display:block; }
  .kicker { position:absolute; left:76px; top:340px; z-index:7;
            font-family:'DM Mono',monospace; font-size:14px; letter-spacing:.34em;
            text-transform:uppercase; color:rgba(246,239,234,.5); }
  h1 { position:absolute; left:76px; top:362px; z-index:7;
       font-family:'Archivo',Arial,sans-serif; font-variation-settings:'wdth' 114,'wght' 820;
       font-size:66px; line-height:1; letter-spacing:-.014em; }
  .role { position:absolute; left:78px; top:444px; z-index:7;
          font-size:25px; font-weight:500; color:rgba(246,239,234,.9); }
  .where { position:absolute; left:78px; top:482px; z-index:7;
           font-size:17px; color:rgba(246,239,234,.48); }
  .firms { position:absolute; left:78px; top:534px; z-index:7;
           font-family:'DM Mono',monospace; font-size:14px; letter-spacing:.2em;
           text-transform:uppercase; color:rgba(246,239,234,.6);
           display:flex; gap:15px; align-items:center; }
  .firms i { display:block; width:5px; height:5px; border-radius:50%;
             background:rgba(246,239,234,.28); font-style:normal; }
  .url { position:absolute; left:78px; top:572px; z-index:7;
         font-family:'DM Mono',monospace; font-size:15px; letter-spacing:.16em;
         color:rgba(246,239,234,.4); }
  .mark { position:absolute; right:76px; bottom:64px; z-index:7; width:88px; opacity:.9; }
</style></head><body>

  </div>

<script>
